name: Auto-merge syncer PRs
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
      - '[0-9][0-9][0-9]'

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'jetbrains-net-syncer[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: 🤖 Enable auto-merge (rebase)
        run: gh pr merge "$PR" --auto --rebase --delete-branch -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
      # "Automatically delete head branches" doesn't cover PRs closed without merging, nor merges made by
      # auto-merge enabled via GITHUB_TOKEN, so sweep the leftovers of previous syncer PRs here
      - name: 🧹 Delete head branches of closed syncer PRs
        run: |
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/plugins-sync/" --paginate --jq '.[].ref | sub("^refs/heads/"; "")')
          open_heads=$(gh pr list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          gh pr list -R "$GITHUB_REPOSITORY" --state closed --author 'app/jetbrains-net-syncer' --limit 100 \
            --json headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | .headRefName | select(startswith("plugins-sync/"))' |
          sort -u | while read -r branch; do
            grep -qxF "$branch" <<< "$existing" || continue
            grep -qxF "$branch" <<< "$open_heads" && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
