name: Build
on:
  push:
    branches:
      - main
      - '[0-9][0-9][0-9]'
  pull_request:
    branches:
      - main
      - '[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Fetch Sources
        uses: actions/checkout@v4

      - name: 🛠 Prepare Build Environment
        uses: ./.github/workflows/prepare-build-env

      - name: 🏗 Build Plugin (Stable)
        uses: gradle/gradle-build-action@v3
        with:
          arguments: buildPlugin